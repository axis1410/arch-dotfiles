set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",tmux-256color:RGB"

set -g focus-events on
set -g mouse on
set -g set-clipboard on
set -sg escape-time 0
set -g history-limit 50000
set -g display-time 2000
set -g status-interval 1
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

bind-key -n S-Enter send-keys Escape "[13;2u"
set -s extended-keys on
set -as terminal-features 'tmux-256color:extkeys'

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

bind-key b set-option status
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r m resize-pane -Z
bind > swap-pane -D
bind < swap-pane -U
bind-key -r Left  swap-window -t -1 \; previous-window
bind-key -r Right swap-window -t +1 \; next-window
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
unbind-key -T copy-mode-vi MouseDragEnd1Pane
bind Enter copy-mode

bind-key "t" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# ── Pane borders ─────────────────────────────────────────────────────────────
set -g pane-border-style        "fg=colour238"
set -g pane-active-border-style "fg=colour250"
set -g pane-border-lines        single

# ── Status bar ───────────────────────────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-style "bg=default,fg=colour250"
set -g status-justify left
set -g status-left-length  60
set -g status-right-length 60

set -g status-left " #[bold]#S#[nobold]  "

set -g status-right "#{?pane_in_copy_mode,#[fg=colour3] COPY ,}#{?window_zoomed_flag,#[fg=colour4] ZOOM ,}#{?client_prefix,#[fg=colour3] PREFIX ,}#[fg=colour250] %H:%M  %d %b "

set -g window-status-separator ""
set -g window-status-format         "#[fg=colour244] #I #W "
set -g window-status-current-format "#[fg=colour250,bold,reverse] #I #W "

set -g message-style       "fg=colour230,bg=colour238"
set -g message-command-style "fg=colour230,bg=colour238"
set -g mode-style          "fg=colour230,bg=colour3,bold"

# ── Plugins ──────────────────────────────────────────────────────────────────
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.config/tmux/plugins/tpm/tpm'
